<svg fill="none" overflow="visible" viewBox="0 0 25 32" width="120" xmlns="http://www.w3.org/2000/svg">
  <title>Ghost</title>
  <style>
    .ghost {
      animation: bob 3.6s ease-in-out infinite;
    }
    .shadow {
      animation: pulse 3.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scaleX(1); }
      50% { opacity: 0.65; transform: scaleX(0.9); }
    }
    .outline, .shadow { fill: #09090b; }
    .shading { fill: #e4e4e7; }
    @media (prefers-color-scheme: dark) {
      .outline, .shadow { fill: #fafafa; }
      .shading { fill: #27272a; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ghost, .shadow { animation: none; }
    }
  </style>
